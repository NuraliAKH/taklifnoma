<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <title>404 — Страница не найдена | Web-Taklifnoma</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #090d16; color: #f8fafc; font-family: Arial, sans-serif; text-align: center; }
      main { width: min(520px, 100%); padding: 48px 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: rgba(15,23,42,.82); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      strong { display: block; color: #fbbf24; font-size: clamp(64px, 20vw, 112px); line-height: .9; }
      h1 { margin: 24px 0 10px; font-size: 26px; }
      p { margin: 0; color: #94a3b8; line-height: 1.6; }
      a { display: inline-block; margin-top: 28px; padding: 13px 20px; border-radius: 12px; background: #f59e0b; color: #0f172a; font-weight: 700; text-decoration: none; }
      a:hover { background: #fbbf24; }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>Страница не найдена</h1>
      <p>Возможно, адрес изменился или страница была удалена.</p>
      <a href="/">Вернуться на главную</a>
    </main>
  </body>
</html>
