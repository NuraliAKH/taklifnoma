# HTTP server: redirect every request to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name web-taklifnoma.uz www.web-taklifnoma.uz;
    return 301 https://web-taklifnoma.uz$request_uri;
}

# Add this redirect to the existing TLS configuration for www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.web-taklifnoma.uz;

    # Use the same certificate paths as the primary server block.
    ssl_certificate /etc/letsencrypt/live/web-taklifnoma.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-taklifnoma.uz/privkey.pem;
    return 301 https://web-taklifnoma.uz$request_uri;
}

# Directives below belong inside the existing HTTPS web-taklifnoma.uz block.
# exact legacy entry points
location = /index.html { return 301 https://web-taklifnoma.uz/; }
location = /index.php  { return 301 https://web-taklifnoma.uz/; }

# canonical trailing-slash policy: root keeps '/', other paths do not.
location ~ ^(.+)/$ { return 301 https://web-taklifnoma.uz$1$is_args$args; }

# Public SPA routes that must work on a direct browser request.
location = / { try_files /index.html =404; }
location ~ ^/(login|register|privacy|cabinet|admin)$ { try_files /index.html =404; }
location ~ ^/(editor|invite)/[^/]+$ { try_files /index.html =404; }
location = /auth/callback { try_files /index.html =404; }

# Unknown extensionless routes return a real HTTP 404 and render the SPA 404 page.
error_page 404 /404.html;
location = /404.html {
    internal;
    try_files /index.html =404;
}
