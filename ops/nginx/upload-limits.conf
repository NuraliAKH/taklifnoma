# Include this file from the web-taklifnoma.uz server block (or its /api/
# location). Keep this value in sync with MAX_UPLOAD_SIZE_BYTES in
# backend/src/templates/templates.controller.ts.
client_max_body_size 100M;
client_body_timeout 120s;

# Do not make nginx buffer the complete upload before forwarding it to NestJS.
proxy_request_buffering off;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
